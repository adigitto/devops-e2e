<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKS GitOps Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #38bdf8;
        }
        .status-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: #334155;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>DevOps EKS Demo</h1>
        <p>Frontend status: <strong style="color: #4ade80;">Healthy</strong></p>
        
        <div class="status-box" id="backend-status">
            Connecting to Backend...
        </div>
    </div>

    <script>
        fetch('/api/data')
            .then(response => response.json())
            .then(data => {
                document.getElementById('backend-status').innerText = data.message;
            })
            .catch(err => {
                document.getElementById('backend-status').innerText = 'Error connecting to backend microservice';
                console.error(err);
            });
    </script>
</body>
</html>
